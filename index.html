<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo dõi Nhiệt độ & Độ ẩm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        .dashboard {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 200px;
        }

        .card-temp { border-top: 5px solid #ff4757; }
        .card-hum { border-top: 5px solid #1e90ff; }

        .title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .value {
            font-size: 40px;
            font-weight: bold;
        }

        .val-temp { color: #ff4757; }
        .val-hum { color: #1e90ff; }

        .unit {
            font-size: 20px;
            color: #666;
        }

        @media (max-width: 500px) {
            .dashboard { flex-direction: column; }
            .card { width: 90%; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Thẻ Nhiệt độ -->
        <div class="card card-temp">
            <div class="title">Nhiệt độ</div>
            <div class="value val-temp">
                <span id="tempValue">--</span><span class="unit">°C</span>
            </div>
        </div>

        <!-- Thẻ Độ ẩm -->
        <div class="card card-hum">
            <div class="title">Độ ẩm</div>
            <div class="value val-hum">
                <span id="humValue">--</span><span class="unit">%</span>
            </div>
        </div>
    </div>

    <!-- CLASS ERa TÍCH HỢP TRỰC TIẾP (Khắc phục lỗi Invalid eraOrigin) -->
    <script>
        class ERa {
            constructor() {
                this.events = {};
                this.configReceived = false;

                window.addEventListener('message', (e) => {
                    const data = e.data;
                    if (!data || typeof data !== 'object') return;
                    
                    // Lọc log rác từ extension/react
                    if (data.source && typeof data.source === 'string' && data.source.includes('react')) return;

                    const type = data.type || data.action;
                    const payload = data.data || data.configuration || data.values || data;

                    if (type === 'configuration' || data.configuration) {
                        this.configReceived = true;
                        if (this.events['configuration']) this.events['configuration'](payload);
                    } else if (type === 'values' || data.values) {
                        if (this.events['values']) this.events['values'](payload);
                    }
                });

                // Liên tục báo cáo "Ready" với E-Ra để nhận dữ liệu
                this.pingInterval = setInterval(() => {
                    if (!this.configReceived) {
                        window.parent.postMessage({ type: 'ready' }, '*');
                        window.parent.postMessage({ action: 'ready' }, '*');
                        window.parent.postMessage('ready', '*');
                    } else {
                        clearInterval(this.pingInterval);
                    }
                }, 1000);
            }

            on(eventName, callback) {
                this.events[eventName] = callback;
            }
        }
    </script>

    <!-- LOGIC BẮT SỰ KIỆN (Giữ nguyên cấu trúc giống hệt video) -->
    <script>
        const era = new ERa();
        let eraConfig = null;

        // Bắt cấu hình từ E-Ra
        era.on('configuration', (config) => {
            eraConfig = config;
            console.log("Đã nhận cấu hình:", config);
        });

        // Bắt giá trị realtime
        era.on('values', (values) => {
            if (!eraConfig || !eraConfig.realtime_configs) return;

            // Ánh xạ đúng 2 vị trí trên bảng Realtime Configs của Widget E-Ra
            // Vị trí 0: Nhiệt độ, Vị trí 1: Độ ẩm
            const tempCfg = eraConfig.realtime_configs[0];
            const humCfg = eraConfig.realtime_configs[1];

            // Cập nhật Nhiệt độ
            if (tempCfg && values[tempCfg.id] !== undefined) {
                const rawVal = values[tempCfg.id];
                const actualVal = (typeof rawVal === 'object' && rawVal !== null) ? rawVal.value : rawVal;
                document.getElementById('tempValue').innerText = parseFloat(actualVal).toFixed(1);
            }
            
            // Cập nhật Độ ẩm
            if (humCfg && values[humCfg.id] !== undefined) {
                const rawVal = values[humCfg.id];
                const actualVal = (typeof rawVal === 'object' && rawVal !== null) ? rawVal.value : rawVal;
                document.getElementById('humValue').innerText = parseFloat(actualVal).toFixed(1);
            }
        });
    </script>

</body>
</html>

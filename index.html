<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo dõi Nhiệt độ & Độ ẩm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        .dashboard {
            display: flex;
            gap: 20px;
        }

        .card {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 200px;
        }

        .card-temp { border-top: 5px solid #ff4757; }
        .card-hum { border-top: 5px solid #1e90ff; }

        .title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .value {
            font-size: 40px;
            font-weight: bold;
        }

        .val-temp { color: #ff4757; }
        .val-hum { color: #1e90ff; }

        .unit {
            font-size: 20px;
            color: #666;
        }

        /* Responsive cho điện thoại */
        @media (max-width: 500px) {
            .dashboard { flex-direction: column; }
            .card { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Thẻ Nhiệt độ -->
        <div class="card card-temp">
            <div class="title">Nhiệt độ</div>
            <div class="value val-temp">
                <span id="tempValue">--</span><span class="unit">°C</span>
            </div>
        </div>

        <!-- Thẻ Độ ẩm -->
        <div class="card card-hum">
            <div class="title">Độ ẩm</div>
            <div class="value val-hum">
                <span id="humValue">--</span><span class="unit">%</span>
            </div>
        </div>
    </div>

    <script>
        // Hàm cập nhật dữ liệu hiển thị
        function updateSensorData(temp, hum) {
            if (temp !== null) document.getElementById('tempValue').innerText = parseFloat(temp).toFixed(1);
            if (hum !== null) document.getElementById('humValue').innerText = parseFloat(hum).toFixed(1);
        }

        // ==================== LÕI GIAO TIẾP E-RA IFRAME ====================
        let eraConfig = null;

        window.addEventListener('message', (e) => {
            if (!e.data || typeof e.data !== 'object') return;
            if (e.data.source && typeof e.data.source === 'string' && e.data.source.includes('react')) return;

            const msgType = e.data.type || e.data.action || 'Unknown';

            // Nhận cấu hình từ E-Ra
            if (msgType === 'configuration' || e.data.configuration) {
                eraConfig = e.data.data || e.data.configuration || e.data;
            } 
            // Nhận dữ liệu Realtime từ E-Ra
            else if (msgType === 'values' || e.data.values) {
                const rConfigs = (eraConfig && eraConfig.realtime_configs) ? eraConfig.realtime_configs : 
                                 (eraConfig && eraConfig.realtimeConfigs)  ? eraConfig.realtimeConfigs : null;
                if (!rConfigs) return;

                const values = e.data.data || e.data.values || e.data;
                let t = null, h = null;

                // Ánh xạ dữ liệu dựa trên vị trí thiết lập trên E-Ra (0: Nhiệt độ, 1: Độ ẩm)
                rConfigs.forEach((cfg, index) => {
                    const valObj = values[cfg.id];
                    if (valObj !== undefined) {
                        const val = (typeof valObj === 'object' && valObj !== null) ? valObj.value : valObj;
                        if (index === 0) t = val;
                        if (index === 1) h = val;
                    }
                });

                updateSensorData(t, h);
            }
        });

        // Báo tín hiệu Ready liên tục cho đến khi E-Ra phản hồi
        let readyTimer = setInterval(() => {
            if (!eraConfig) {
                window.parent.postMessage({ type: 'ready' }, '*');
                window.parent.postMessage({ action: 'ready' }, '*');
            } else {
                clearInterval(readyTimer);
            }
        }, 2000);
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo dõi Nhiệt độ & Độ ẩm</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        .dashboard {
            display: flex;
            gap: 20px;
        }

        .card {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 200px;
        }

        .card-temp { border-top: 5px solid #ff4757; }
        .card-hum { border-top: 5px solid #1e90ff; }

        .title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .value {
            font-size: 40px;
            font-weight: bold;
        }

        .val-temp { color: #ff4757; }
        .val-hum { color: #1e90ff; }

        .unit {
            font-size: 20px;
            color: #666;
        }

        /* Responsive cho điện thoại */
        @media (max-width: 500px) {
            .dashboard { flex-direction: column; }
            .card { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- Thẻ Nhiệt độ -->
        <div class="card card-temp">
            <div class="title">Nhiệt độ</div>
            <div class="value val-temp">
                <span id="tempValue">--</span><span class="unit">°C</span>
            </div>
        </div>

        <!-- Thẻ Độ ẩm -->
        <div class="card card-hum">
            <div class="title">Độ ẩm</div>
            <div class="value val-hum">
                <span id="humValue">--</span><span class="unit">%</span>
            </div>
        </div>
    </div>

    <!-- PHẦN 1: TÍCH HỢP LÕI THƯ VIỆN E-RA TRỰC TIẾP -->
    <script>
        class ERa {
            constructor() {
                this.listeners = {};
                this.configReceived = false;

                window.addEventListener('message', (e) => {
                    if (!e.data || typeof e.data !== 'object') return;
                    
                    const msgType = e.data.type || e.data.action;
                    const payload = e.data.data || e.data.configuration || e.data.values || e.data;

                    if (msgType === 'configuration' || e.data.configuration) {
                        this.configReceived = true;
                        if (this.listeners['configuration']) this.listeners['configuration'](payload);
                    } 
                    else if (msgType === 'values' || e.data.values || e.data.data) {
                        if (this.listeners['values']) this.listeners['values'](payload);
                    }
                });

                // Tự động báo cho máy chủ E-Ra biết iFrame đã load xong
                this.pingInterval = setInterval(() => {
                    if (!this.configReceived) {
                        window.parent.postMessage({ type: 'ready' }, '*');
                    } else {
                        clearInterval(this.pingInterval);
                    }
                }, 1000);
            }

            on(eventName, callback) {
                this.listeners[eventName] = callback;
            }
        }
    </script>

    <script>
        // PHẦN 2: KHỞI TẠO VÀ BẮT SỰ KIỆN ĐỂ CẬP NHẬT REALTIME
        const era = new ERa();

        // Bắt cấu hình
        era.on('configuration', (config) => {
            console.log("Đã nhận cấu hình từ E-Ra:", config);
        });

        // Bắt sự kiện values - Quét toàn bộ giá trị gửi xuống (Không phụ thuộc thứ tự mảng)
        era.on('values', (values) => {
            if (!values) return;

            let extractedValues = [];
            
            // Trích xuất toàn bộ các số được gửi xuống từ Realtime Configs
            for (let key in values) {
                let rawVal = values[key];
                let actualVal = (typeof rawVal === 'object' && rawVal !== null) ? rawVal.value : rawVal;
                extractedValues.push(actualVal);
            }

            // Gán dữ liệu lên giao diện
            if (extractedValues.length > 0 && extractedValues[0] !== undefined) {
                document.getElementById('tempValue').innerText = parseFloat(extractedValues[0]).toFixed(1);
            }
            if (extractedValues.length > 1 && extractedValues[1] !== undefined) {
                document.getElementById('humValue').innerText = parseFloat(extractedValues[1]).toFixed(1);
            }
        });
    </script>

</body>
</html>
